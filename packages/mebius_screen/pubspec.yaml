name: mebius_screen
description: Desktop screen-share agent and viewer for Mebius — enroll a device, publish its screen on demand, and watch or remote-control it.
version: 0.1.0
publish_to: none
repository: https://github.com/russimobiledroidx/mebius-flutter-sdk

environment:
  # win32 6 is written with dot shorthands, which need Dart 3.10.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  clock: ^1.1.2
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.0
  http: ^1.6.0
  mebius:
    path: ../..
  meta: ^1.16.0
  win32: ^6.4.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
