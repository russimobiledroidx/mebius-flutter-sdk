name: mebius_screen
description: Desktop screen-share agent and viewer for Mebius — enroll a device, publish its screen on demand, and watch or remote-control it.
version: 0.1.0
repository: https://github.com/russimobiledroidx/mebius-flutter-sdk/tree/main/packages/mebius_screen
issue_tracker: https://github.com/russimobiledroidx/mebius-flutter-sdk/issues

environment:
  # win32 6 is written with dot shorthands, which need Dart 3.10.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  clock: ^1.1.2
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.0
  http: ^1.6.0
  # Tight on purpose: this package reaches into mebius beyond its documented
  # API (MebiusClient.internal, MebiusPlayer.engine), which a minor release
  # may change. In this repo pubspec_overrides.yaml points it at ../.. .
  mebius: ">=0.7.0 <0.8.0"
  meta: ^1.16.0
  win32: ^6.4.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
