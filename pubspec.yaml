name: mebius
description: Mebius live video SDK for Flutter — broadcast and watch real-time streams through the Mebius gateway with a single, simple API.
version: 0.3.0
repository: https://github.com/russimobiledroidx/mebius-flutter-sdk
homepage: https://github.com/russimobiledroidx/mebius-flutter-sdk
issue_tracker: https://github.com/russimobiledroidx/mebius-flutter-sdk/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  # Time as a seam, not a global. Every renewal decision below is "how much of
  # this credential is left", and with a hardcoded DateTime.now() none of that
  # arithmetic can be driven by a test — the retry window and the backoff would
  # ship unverified. `clock` is the Dart team's standard answer and is already in
  # the tree via flutter_test.
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.5.0
  http: ^1.6.0
  meta: ^1.16.0
  video_player: ^2.11.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
